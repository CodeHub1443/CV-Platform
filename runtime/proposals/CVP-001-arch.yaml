task_contracts:
- acceptance_criteria:
  - 'Schema covers all owned entities: projects, sites, camera_configurations, scene_configurations,
    ai_applications, models, rules, users, feature_flags, deployments'
  - Project is the root entity; all other entities reference project_id with a foreign
    key
  - Deployment table stores a versioned JSON snapshot of configuration at deploy time
    — no live foreign key references to mutable config entities
  - Camera configuration records live exclusively in this schema — Camera Platform
    has no relational camera config table
  - Every table includes created_at, updated_at, and a version or etag column to support
    ConfigurationObject version field
  - PostgreSQL-only features used; no vendor-specific extensions outside the Technology
    Stack v1.0 standard
  - No implementation code is produced
