acceptance_criteria:
- 'Configuration Platform owns exactly: Projects, Sites, Camera Configuration records,
  Scene Configuration records, AI Applications, Models, Rules, Users, Feature Flags,
  Deployments'
- Camera runtime lifecycle, health, and session state are NOT owned by Configuration
  Platform — those belong to Camera Platform and Camera Session Manager respectively
- All configuration exposed to other platforms is wrapped in ConfigurationObject {object_type,
  version, owner, parameters, validation, effective_date}
- No other platform's internal objects or libraries are imported by Configuration
  Platform
- PostgreSQL is the only relational database used — no alternative relational database
  is introduced
- REST is used for all configuration CRUD operations per Technology Stack v1.0
- api-core and db-core are the only shared modules used — no new infrastructure modules
  are introduced
- No implementation code is produced in task CVP-001
architecture: 'The Configuration Platform is the authoritative source of all system
  configuration in the CV Platform. It is structured as a four-layer service. Layer
  1 — REST API Layer: exposes CRUD endpoints for all owned entities using api-core;
  every response is serialized as a ConfigurationObject. Layer 2 — Service Layer:
  validates configuration changes, enforces versioning, manages entity lifecycle,
  and coordinates relationships between owned entities. Layer 3 — Repository Layer:
  one repository per configuration entity, all backed by db-core; no raw database
  drivers permitted. Layer 4 — Database: PostgreSQL as the relational standard per
  Technology Stack v1.0. Entity hierarchy: Project is the root aggregate. A Project
  contains Sites, Users, Feature Flags, AI Applications, and Deployments. A Site contains
  Camera Configuration records and Scene Configuration records. An AI Application
  contains Models and Rules. A Deployment links an AI Application to a Site and stores
  a versioned snapshot of configuration at deploy time. Ownership boundary: Configuration
  Platform owns static camera configuration records (RTSP URL, credentials, capabilities,
  resolution, codec). Camera Platform reads these records via ConfigurationObject
  and retains exclusive ownership of runtime lifecycle, health, and session state.
  ConfigurationObject compliance: all configuration exposed to other platforms is
  wrapped in the standard contract with fields object_type, version, owner, parameters,
  validation, and effective_date. No internal implementation objects cross platform
  boundaries. Configuration propagation model for baseline: REST pull. Consumers fetch
  ConfigurationObject by ID or query and compare the version field to detect staleness.
  NATS JetStream push events for configuration changes are deferred to a post-baseline
  iteration. api-core and db-core are the only shared infrastructure modules required.
  No new infrastructure modules are introduced.'
