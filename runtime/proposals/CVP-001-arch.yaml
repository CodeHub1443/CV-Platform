unresolved_decisions:
- id: UD-001
  question: Should Configuration Platform publish configuration-change events to NATS
    JetStream when entities are created, updated, or deleted as part of the baseline,
    or is REST pull with version comparison sufficient?
  recommendation: REST pull is sufficient for the baseline. NATS JetStream push events
    for configuration changes should be added as a follow-on task once the REST API
    is stable and consumers are identified.
- id: UD-002
  question: Should Deployment store a full versioned snapshot of configuration at
    deploy time, or store live references that reflect the current state of each configuration
    entity?
  recommendation: Deployment must store a versioned snapshot. A live reference would
    cause active deployments to silently change behavior when upstream configuration
    is updated, which is unsafe in a production CV system.
