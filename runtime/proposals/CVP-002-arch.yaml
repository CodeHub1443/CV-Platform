unresolved_decisions:
- id: UD-003
  question: Should the configuration schema reside in a dedicated PostgreSQL schema
    namespace (e.g., CREATE SCHEMA configuration) or in the public schema?
  recommendation: Use a dedicated schema namespace (CREATE SCHEMA configuration).
    This isolates Configuration Platform tables from other platform tables that may
    share the same PostgreSQL instance, enables per-schema access controls, and prevents
    table name collisions.
- id: UD-004
  question: Should soft-delete (is_active BOOLEAN) be the sole deletion mechanism,
    or should hard DELETE with archive tables be supported?
  recommendation: Soft-delete with is_active is sufficient for the baseline. Hard
    DELETE is unsafe when downstream snapshots or audit logs reference the entity.
    Archive tables can be introduced in a future iteration if storage pressure or
    compliance requirements demand it.
- id: UD-005
  question: Should scene_configs belong to camera_configs directly, or to a Site?
    The CVP-001 spec states 'A Site contains Camera Configuration records and Scene
    Configuration records', implying SceneConfig could belong to Site. The CVP-002
    acceptance criteria states SceneConfig belongs to CameraConfig.
  recommendation: SceneConfig belongs to CameraConfig as specified in the CVP-002
    acceptance criteria. Scene configuration is camera-specific (ROIs, calibration,
    ground plane are defined per camera view) and is most cohesively owned at the
    camera level. The CVP-001 description is a loose grouping — the precise FK is
    camera_configs.
