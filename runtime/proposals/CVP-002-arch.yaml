id: CVP-002-arch
notes: 'The Deployment snapshot design resolves UD-002 from CVP-001. The snapshot
  must be assembled by the repository layer at deploy time by joining the full entity
  tree: AIApplication with its Models and Rules, plus the Site with its CameraConfigs
  and their SceneConfigs. The DDL task CVP-003 should include a JSONB schema comment
  that documents the expected snapshot structure so that the repository developer
  has an unambiguous contract to implement against.'
reusable_modules:
- module: db-core
  purpose: PostgreSQL connection management, query execution, transaction support,
    and repository base classes. Provides the connection pool and base repository
    abstractions consumed by the Configuration Platform repository layer.
risks:
- description: 'Snapshot staleness: ai_application_snapshot and site_snapshot in the
    deployments table must capture the full nested entity tree at deploy time. If
    the snapshot logic omits child entities (models, rules, scene_configs), the deployment
    will have an incomplete configuration.'
  id: R-004
  mitigation: Define the snapshot schema explicitly in the DDL task (CVP-003) using
    a JSONB structure comment. The repository layer that writes deployments must assemble
    the full tree before persisting the snapshot. Add a CHECK constraint that validates
    the JSONB snapshot contains required top-level keys.
- description: 'JSONB credentials exposure: camera_configs.credentials is stored as
    JSONB. Storing plaintext credentials in a relational column is a security risk
    if column-level encryption or a secrets manager is not applied.'
  id: R-005
  mitigation: At schema design time, document that camera_configs.credentials must
    store only a reference token or encrypted blob, not plaintext credentials. The
    Service Platform or a dedicated secrets manager should hold the actual secret.
    This constraint must be stated in the DDL migration comment.
- description: 'Version column semantics: version is an INTEGER that is incremented
    on each mutation. Without an explicit SEQUENCE or application-layer enforcement,
    concurrent writes could produce duplicate version numbers on the same entity.'
  id: R-006
  mitigation: The repository layer (built on db-core) must increment version using
    an atomic UPDATE ... SET version = version + 1 WHERE version = :expected_version
    pattern (optimistic concurrency). This must be specified as a requirement in the
    CVP-003 repository task.
