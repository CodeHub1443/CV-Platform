acceptance_criteria:
- 'Schema defines tables for all 10 owned entities: projects, sites, camera_configs,
  ai_applications, models, rules, scene_configs, users, feature_flags, deployments'
- project_users join table correctly models the many-to-many relationship between
  users and projects with a role column
- Every table includes version, owner, and effective_date columns satisfying the ConfigurationObject
  contract
- 'FK hierarchy is correctly encoded: sites→projects, camera_configs→sites, ai_applications→projects,
  models→ai_applications, rules→ai_applications, scene_configs→camera_configs, deployments→projects'
- deployments.ai_application_ref and deployments.site_ref are UUID columns without
  FK enforcement; deployments.ai_application_snapshot and deployments.site_snapshot
  are JSONB NOT NULL snapshot columns
- No FK constraint exists from deployments to ai_applications or sites — snapshot
  isolation is the authoritative mechanism
- Status and classification fields use VARCHAR with CHECK constraints, not ENUM types
- All FK columns carry an index
- All tables use UUID PKs with gen_random_uuid() default
- No implementation code is produced in task CVP-002
architecture: 'The Configuration Platform PostgreSQL schema consists of 10 tables,
  one per owned entity: projects, sites, camera_configs, ai_applications, models,
  rules, scene_configs, users, feature_flags, deployments. All tables use UUID primary
  keys generated by gen_random_uuid(). Every table carries the three ConfigurationObject
  contract columns: version (INTEGER NOT NULL DEFAULT 1, incremented on each mutation),
  owner (VARCHAR(255) NOT NULL, identifies the platform or user record owner), and
  effective_date (TIMESTAMPTZ NOT NULL, when this configuration version becomes authoritative).
  All tables also carry created_at and updated_at (TIMESTAMPTZ NOT NULL DEFAULT NOW()).
  Entity hierarchy is enforced with FK constraints using ON DELETE RESTRICT to prevent
  orphaned records: sites.project_id references projects(id); camera_configs.site_id
  references sites(id); ai_applications.project_id references projects(id); models.ai_application_id
  references ai_applications(id); rules.ai_application_id references ai_applications(id);
  scene_configs.camera_config_id references camera_configs(id); deployments.project_id
  references projects(id). The deployments table does NOT enforce FK constraints to
  ai_applications or sites. Instead it carries ai_application_ref (UUID) and site_ref
  (UUID) as soft traceability references, and stores two JSONB snapshot columns: ai_application_snapshot
  and site_snapshot. These snapshots capture the complete versioned configuration
  tree at deploy time — including nested models, rules, camera_config, and scene_config
  — so active deployments are fully isolated from upstream configuration changes.
  Flexible and extensible configuration parameters (camera credentials, resolution,
  capabilities, ROIs, zones, calibration, rule parameters, model hyperparameters)
  are stored in JSONB columns throughout. Status and role fields use VARCHAR with
  CHECK constraints rather than ENUM types to allow extension without ALTER TYPE migrations.
  The is_active BOOLEAN column on entity tables supports soft-delete. The users table
  is a top-level entity; a separate project_users join table (project_id, user_id,
  role) resolves the many-to-many project membership relationship. All FK columns
  are indexed. The schema lives in the configuration schema namespace within the shared
  PostgreSQL instance.'
