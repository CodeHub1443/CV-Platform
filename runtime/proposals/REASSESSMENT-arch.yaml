acceptance_criteria:
- 'After CVP-010: GET /api/v1/projects without Authorization header returns 401; GET
  /health without token returns 200; server startup fails with clear RuntimeError
  when SECRET_KEY is absent'
- 'After CVP-011: cv-platform-create-admin creates an admin user that can authenticate
  via POST /api/v1/auth/token; re-running with the same username exits 1 without creating
  a duplicate'
- 'After CVP-012: nats_core module is importable; publish/subscribe/ensure_stream
  work against a live NATS instance; all unit tests pass without a live NATS server'
- 'After CVP-013: CameraDescriptor contract is produced by CameraService.get_descriptor();
  grep for AI/inference concepts in cv_platform/camera/ returns zero matches; 20+
  unit tests pass'
architecture: 'All six Configuration Platform tasks (CVP-004 through CVP-009) are
  marked done. The functional vertical slice is present: domain models, PostgreSQL
  repositories, Alembic schema, service layer, REST API, server bootstrap, db-core
  shared module, and auth shared module all exist in the codebase. One critical correctness
  gap survives from CVP-009: server.py:_build_app() calls create_configuration_app()
  without passing user_repo, so the JWT before_request hook is never registered in
  the production WSGI entry point — all 10 entity endpoints are unprotected in production.
  A second operational gap exists: with auth enforced there is no mechanism to create
  the first user (bootstrap deadlock). These two gaps must be closed before the Configuration
  Platform can be declared truly deployable. Four task contracts are proposed. CVP-010
  wires the existing auth module into the production server and validates SECRET_KEY
  at startup. CVP-011 adds an admin bootstrap CLI that seeds the first user directly
  via db-core, bypassing the auth requirement. CVP-012 implements the NATS + JetStream
  event bus as a shared module, establishing the foundational inter-platform communication
  infrastructure required before downstream platforms (Camera Session Manager, AI
  Runtime, etc.) can be built correctly. CVP-013 begins the Camera Platform — the
  next platform in the canonical processing chain — with its domain models, repository
  interfaces, and service layer, producing the CameraDescriptor contract defined in
  Platform Contracts v1.0 section 4.1. No new permanent platform is introduced. All
  13 platform boundaries remain intact. After CVP-013, the next reassessment should
  address Camera Platform PostgreSQL implementation, REST API, and ONVIF/discovery
  service integration.'
