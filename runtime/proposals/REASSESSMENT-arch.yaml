unresolved_decisions:
- id: D-003
  impact: medium
  question: 'NATS event publishing from synchronous Flask context: should the Configuration
    Platform publish deployment-activation events synchronously (blocking the request
    with asyncio.run()) or fire-and-forget via a background thread pool?'
  recommendation: Fire-and-forget via a shared asyncio event loop running in a daemon
    thread. The request does not block on NATS delivery. Delivery failure is logged
    but does not fail the HTTP request. This matches the eventual-consistency model
    appropriate for config-change notifications.
- id: D-004
  impact: medium
  question: 'Camera credential encryption key management: Fernet (symmetric, key rotation
    friendly) vs AES-GCM (lower-level, more control). Both require a CAMERA_CREDENTIAL_KEY
    environment variable.'
  recommendation: Use cryptography.fernet.Fernet for CVP-013's follow-on repository
    task. It handles key rotation via MultiFernet and has a simpler API than raw AES-GCM.
    Introduce a shared cv_platform/shared/crypto_core/ module to avoid duplicating
    the encryption pattern across platforms.
- id: D-005
  impact: low
  question: 'Camera Platform discovery: ONVIF requires onvif-zeep-async (large async
    SOAP dependency). Should the first Camera Platform task include discovery services
    or defer them to a later task focused solely on camera discovery?'
  recommendation: CVP-013 and its follow-on (PostgreSQL + API) should NOT include
    ONVIF. Discovery services are a separate concern. After CVP-013, a dedicated CVP-01N
    implements CameraDiscoveryService with ONVIF + passive ARP scan as the minimum
    viable discovery mechanism. SSDP and mDNS follow without architectural change.
