created_by: architect
dependencies:
- CVP-010 depends on CVP-009 (done) — auth shared module must exist before it can
  be wired
- CVP-011 depends on CVP-010 — admin bootstrap is only meaningful once auth is active;
  the created user must be testable end-to-end
- CVP-012 has no dependencies — can be implemented in parallel with CVP-010/CVP-011
- CVP-013 depends on CVP-010 — Camera Platform REST API (future) will use api-core
  and auth; domain/service layer can be started but the overall platform presupposes
  auth is correct
- 'CVP-013 knowledge dependency: camera-management capability in knowledge registry
  must be accessible before implementation begins'
- Future Camera Platform PostgreSQL repository task will depend on CVP-013 (domain/interfaces)
  and CVP-006 (db-core, already done)
- Future Camera Session Manager depends on CVP-013 (CameraDescriptor contract) and
  CVP-012 (NATS for StreamSession publication)
id: REASSESSMENT-arch
notes: 'The previous REASSESSMENT-arch.yaml (status: applied) proposed CVP-006 through
  CVP-009, all of which are now done. This reassessment identifies one survivng correctness
  gap (auth not wired — CVP-010), one operational gap (bootstrap deadlock — CVP-011),
  one infrastructure prerequisite (NATS event bus — CVP-012), and the first task for
  the next platform in the canonical chain (Camera Platform domain — CVP-013). The
  Configuration Platform will be the first fully deployable and secured platform after
  CVP-010 and CVP-011 are complete. The overall architecture remains stable at 13
  permanent platforms. The next reassessment after CVP-013 should address Camera Platform
  PostgreSQL repository implementation, REST API, camera credential encryption (crypto-core
  shared module), and the ONVIF/discovery service integration.'
reusable_modules:
- consumers:
  - Event Platform
  - Camera Platform (config-change notifications)
  - Camera Session Manager
  - AI Runtime Platform
  - all future event-producing platforms
  name: nats-core
  path: cv_platform/shared/nats_core/
  responsibility: Async NATS + JetStream client wrapper. Provides connect(url), disconnect(),
    publish(subject, payload), subscribe(subject, handler), and ensure_stream(name,
    subjects) primitives. Reads NATS_URL from environment. Wraps nats-py. Zero knowledge
    of any platform domain. Reused by every platform that publishes or consumes events.
risks:
- description: 'Auth not active in production: server.py:_build_app() does not pass
    user_repo to create_configuration_app(), so the JWT before_request hook is never
    registered. All 10 entity CRUD endpoints are publicly accessible in the current
    production WSGI entry point.'
  id: R-005
  mitigation: CVP-010 must be the first task executed. Its acceptance criteria require
    end-to-end 401 tests against the server bootstrap path, not just the Flask test
    client used in CVP-005 tests.
  severity: critical
- description: 'Bootstrap deadlock: once CVP-010 wires auth, creating any user requires
    a valid JWT, but obtaining a JWT requires an existing user. Without CVP-011, the
    system cannot be initialized after a clean deployment.'
  id: R-006
  mitigation: CVP-011 must be delivered immediately after CVP-010. The CLI bypasses
    auth entirely and operates directly on db-core, breaking the deadlock.
  severity: high
- description: 'Async/sync boundary for NATS: nats-py is an async-only library. The
    Configuration Platform and Camera Platform (when its API is built) use synchronous
    Flask + Gunicorn. Integrating an async NATS publisher into a sync request handler
    requires an event-loop bridge (e.g., asyncio.run() in a thread) or a separate
    async process.'
  id: R-007
  mitigation: CVP-012 implements the NATS shared module as a pure async module. Sync
    platforms (Configuration, Camera API) that need to publish events run a dedicated
    async thread with its own event loop, invoked from a sync wrapper. This pattern
    is established in CVP-012 and documented so all future platforms follow it consistently.
  severity: high
- description: 'Configuration change propagation gap: when a Deployment is activated
    or deactivated, downstream platforms (Camera Session Manager, AI Runtime) must
    be notified. Without the event bus (CVP-012), they must poll the Configuration
    Platform REST API. Polling increases coupling and latency.'
  id: R-008
  mitigation: Accept polling as the interim mechanism until CVP-012 is done. After
    CVP-012, add a config-change event publisher to DeploymentService.activate/deactivate.
    This is a future enhancement, not a blocker for CVP-013.
  severity: medium
- description: 'Credential encryption for CameraCredential: the Camera Platform must
    store RTSP credentials. Storing them as plaintext in PostgreSQL violates security
    requirements. The auth module provides bcrypt (one-way); camera credentials require
    reversible encryption for RTSP URL construction.'
  id: R-009
  mitigation: CVP-013 defines CameraCredential with password_encrypted field (bytes).
    The encryption mechanism (Fernet/AES-GCM via CAMERA_CREDENTIAL_KEY env var) is
    deferred to the PostgreSQL repository task. CVP-013 domain and service layer treat
    the field as opaque bytes — no plaintext is stored in domain objects after the
    service boundary.
  severity: low
status: proposed
