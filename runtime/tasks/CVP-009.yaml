acceptance_criteria:
- POST /api/v1/auth/token with valid credentials returns a signed JWT containing user_id
  and roles claims
- POST /api/v1/auth/token with invalid credentials returns 401
- 'All Configuration Platform endpoints except /health and /api/v1/auth/token require
  a valid Authorization: Bearer <token> header'
- Expired or malformed JWT returns 401
- JWT payload carries user_id; require_auth makes current user available to route
  handlers via get_current_user()
- SECRET_KEY missing at startup raises a clear configuration error
- Password verification uses bcrypt — plaintext comparison is forbidden
- auth shared module has zero imports from any platform domain — it is fully platform-agnostic
- PyJWT and bcrypt added to pyproject.toml dependencies
