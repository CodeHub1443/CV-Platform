notes: "Implemented auth shared module and Configuration Platform JWT middleware.\n\
  Outputs:\n  - cv_platform/shared/auth/_jwt.py — issue_token / decode_token via PyJWT;\
  \ reads\n    SECRET_KEY from env; raises RuntimeError with clear message if missing.\n\
  \  - cv_platform/shared/auth/_middleware.py — require_auth decorator; sets g._auth_user\n\
  \    on success; returns 401 for missing/expired/invalid tokens.\n  - cv_platform/shared/auth/__init__.py\
  \ — public surface: issue_token, require_auth,\n    get_current_user.  Zero platform-domain\
  \ imports.\n  - cv_platform/configuration/api/auth.py — POST /api/v1/auth/token;\
  \ bcrypt password\n    verification; returns signed JWT with user_id and roles claims.\n\
  \  - cv_platform/configuration/api/app.py — updated with optional user_repo param;\n\
  \    when provided: registers auth router, calls _get_secret() eagerly (startup\
  \ check),\n    and applies before_request hook that exempts /health and /api/v1/auth/token.\n\
  \    Backward-compatible: existing tests that don't pass user_repo are unaffected.\n\
  \  - pyproject.toml — PyJWT>=2.8 and bcrypt>=4.0 added.\n  - tests/shared/auth/test_jwt.py\
  \ — unit tests: issue, decode, expiry, wrong sig, missing key.\n  - tests/shared/auth/test_middleware.py\
  \ — unit tests: valid token, missing/expired/\n    invalid header, get_current_user\
  \ payload.\n  - tests/configuration/api/test_auth.py — integration tests: token\
  \ endpoint (valid,\n    wrong password, unknown user, missing fields), protected\
  \ routes (valid token,\n    no token 401, expired 401, malformed 401), exempt paths,\
  \ startup validation.\nNote: server.py was not modified (not in task outputs); to\
  \ enable auth in production\nthe _build_app() in server.py should pass user_repo=_UserRepo()\
  \ to create_configuration_app.\n"
title: Implement auth shared module and Configuration Platform JWT middleware
