- cv_platform/shared/auth/_jwt.py — JWT encode/decode using PyJWT; reads SECRET_KEY
  from env
- cv_platform/shared/auth/_middleware.py — require_auth decorator compatible with
  Flask before_request and route decorator pattern
- cv_platform/configuration/api/auth.py — POST /api/v1/auth/token endpoint (username
  + password -> JWT via bcrypt hash verification)
- cv_platform/configuration/api/app.py — updated to register auth router and apply
  require_auth to all protected routes
- pyproject.toml — PyJWT and bcrypt added as dependencies
- tests/shared/auth/ — unit tests for token issuance, expiry, and invalid-token rejection
- 'tests/configuration/api/test_auth.py — integration tests: protected route with
  valid token, expired token (401), missing token (401)'
