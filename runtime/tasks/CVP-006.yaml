notes: |
  Implemented db_core shared module.
  Outputs:
    - cv_platform/shared/db_core/__init__.py — public surface: get_session, init_db
    - cv_platform/shared/db_core/_pool.py — ThreadedConnectionPool; init_db(url) with
      DATABASE_URL env fallback; double-init idempotent; _reset_pool() test helper
    - cv_platform/shared/db_core/_session.py — get_session() context manager; commits
      on normal exit, rolls back and re-raises on exception, always returns conn to pool
    - pyproject.toml — psycopg2-binary>=2.9 added to dependencies
    - tests/shared/db_core/test_db_core.py — 14 unit tests (no real PG required):
