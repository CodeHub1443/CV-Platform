        TestGetSessionCommit: commit called, putconn called, autocommit=False
        TestGetSessionRollback: rollback called, putconn called, exception propagates
        TestPoolReuse: same pool used across sessions, get_pool returns correct object
  Module contains no Configuration Platform or domain knowledge; importable standalone.
