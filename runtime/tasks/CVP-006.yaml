acceptance_criteria:
- get_session() is a context manager that yields a connection, commits on normal exit,
  rolls back on exception
- init_db(url) initialises the pool; DATABASE_URL env var is used when url is not
  supplied
- No ORM or query-builder is imposed — bare psycopg2-binary cursors are exposed
- Module exposes no Configuration Platform or domain knowledge
- Module is importable by any future platform repository without modification
- Tests verify commit, rollback, and pool re-use behaviour
- psycopg2-binary added to pyproject.toml dependencies
