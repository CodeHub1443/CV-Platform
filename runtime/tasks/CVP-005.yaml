acceptance_criteria:
- 'REST endpoints implemented for all entities: Project, Site, CameraConfig, AIApplication,
  Model, Rule, SceneConfig, User, FeatureFlag, Deployment'
- Every API response is wrapped in ConfigurationObject with all required fields populated
- api-core is used for routing and request handling — no alternative HTTP framework
  is introduced
- No internal implementation objects are exposed in API responses
- 'HTTP status codes are correct: 200 OK, 201 Created, 400 Bad Request, 404 Not Found,
  409 Conflict'
- Configuration Platform does not import or call internal libraries of any other platform
- Endpoints support filtering by parent entity, for example GET /sites?project_id={id}
