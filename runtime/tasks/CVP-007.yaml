notes: "Implemented all 10 PostgreSQL repository concrete classes and Alembic schema.\n\
  Outputs produced:\n  - cv_platform/configuration/domain/models.py — password_hash:\
  \ Optional[str] = None added to User\n  - cv_platform/configuration/api/_serializers.py\
  \ — no change needed; serialize_user already omits password_hash\n  - cv_platform/configuration/repositories/postgres/\
  \ — 10 concrete repos (psycopg2 raw SQL)\n  - alembic.ini, alembic/env.py — DATABASE_URL\
  \ env var or ini key for connection\n  - alembic/versions/001_configuration_platform.py\
  \ — 11 tables (10 entities + project_users), all JSONB columns, password_hash\n\
  \  - pyproject.toml — alembic>=1.13 added\n  - tests/configuration/repositories/\
  \ — integration tests (require DATABASE_URL; schema auto-applied via Alembic)\n\
  Key design decisions:\n  - Repos accept conn (psycopg2 connection) in __init__;\
  \ caller manages transaction life via get_session()\n  - Optimistic locking: UPDATE\
  \ WHERE id=? AND version=project.version-1; raises OptimisticLockError if no row\
  \ returned\n  - psycopg2.extras.register_uuid() called in postgres/__init__.py so\
  \ UUID columns round-trip as uuid.UUID\n  - JSONB write: psycopg2.extras.Json(value);\
  \ JSONB read: auto-deserialized by psycopg2>=2.9\n  - find_by_username delegates\
  \ to get_by_username (returns User including password_hash from DB)\n  - EXISTS\
  \ queries used for all 5 boolean guard methods\n  - Integration tests wrap each\
  \ test in a rolled-back transaction for isolation\n"
