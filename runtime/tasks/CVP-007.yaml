acceptance_criteria:
- All 10 repository ABCs are fully implemented with no unimplemented abstract methods
- 'User domain model is updated to include password_hash: Optional[str] = None; the
  field is excluded from all API serializers and does not appear in any HTTP response
  body'
- 'UserRepository concrete implementation includes find_by_username(username: str)
  -> Optional[User] for auth credential lookup'
- 'Optimistic locking: every UPDATE statement includes WHERE id = ? AND version =
  expected_version; OptimisticLockError is raised when rows_affected = 0'
- 'JSONB columns used for: CameraConfig.credentials, CameraConfig.resolution, CameraConfig.capabilities,
  Model.parameters, Rule.parameters, SceneConfig.rois, SceneConfig.zones, SceneConfig.ground_plane,
  SceneConfig.privacy_masks, SceneConfig.calibration, Deployment.ai_application_snapshot,
  Deployment.site_snapshot'
- has_any_for_site, has_any_for_camera_config, has_active_by_project, has_active_by_ai_application,
  has_active_by_site return correct boolean using EXISTS queries
- Alembic migration 001 runs cleanly on an empty PostgreSQL database and includes
  the users.password_hash column
- Alembic downgrade reverses the migration cleanly
- 'Integration tests cover: create, get, list (with filters), update (optimistic lock
  success and failure), delete, all boolean guard methods'
- A test asserts that GET /api/v1/users/{id} response body does not contain a password_hash
  field
- alembic added to pyproject.toml dependencies
