acceptance_criteria:
- 'One service per entity group: ProjectService, SiteService, CameraConfigService,
  AIApplicationService, ModelService, RuleService, SceneConfigService, UserService,
  FeatureFlagService, DeploymentService'
- Each service validates inputs before delegating to repositories
- Services coordinate cross-entity rules, for example preventing deletion of a Project
  that has active Deployments
- Services return domain objects — ConfigurationObject serialization is the responsibility
  of the API layer, not the service layer
- Services do not import or depend on the API layer
- Services do not import internal libraries of any other platform
